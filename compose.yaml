name: synvo-assistant

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synvo}
      POSTGRES_USER: ${POSTGRES_USER:-synvo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synvo_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - synvo_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-synvo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-synvo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-synvo_local}
      SYNVO_LARK_ENABLED: ${SYNVO_LARK_ENABLED:-false}
      SYNVO_LARK_APP_ID: ${SYNVO_LARK_APP_ID:-}
      SYNVO_LARK_APP_SECRET: ${SYNVO_LARK_APP_SECRET:-}
      SYNVO_LARK_TRANSPORT: ${SYNVO_LARK_TRANSPORT:-websocket}
      SYNVO_LARK_PILOT_OPEN_ID: ${SYNVO_LARK_PILOT_OPEN_ID:-}
      SYNVO_LARK_H5_BASE_URL: ${SYNVO_LARK_H5_BASE_URL:-}
      SYNVO_TOKEN_ENCRYPTION_KEY: ${SYNVO_TOKEN_ENCRYPTION_KEY:-}
      SYNVO_SESSION_SECURE_COOKIE: ${SYNVO_SESSION_SECURE_COOKIE:-true}
      SYNVO_MODEL_ENABLED: ${SYNVO_MODEL_ENABLED:-false}
      SYNVO_MODEL_BASE_URL: ${SYNVO_MODEL_BASE_URL:-}
      SYNVO_MODEL_NAME: ${SYNVO_MODEL_NAME:-}
      SYNVO_MODEL_API_KEY: ${SYNVO_MODEL_API_KEY:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  synvo_postgres_data:
