services:
  backend:
    environment:
      SYNVO_CODEX_ENABLED: "true"
      SYNVO_CODEX_WORKSPACES_0_ID: finance
      SYNVO_CODEX_WORKSPACES_0_DISPLAY_NAME: Finance
      SYNVO_CODEX_WORKSPACES_0_RUNNER_ROOT: /workspaces/finance
      SYNVO_CODEX_WORKSPACES_0_NATIVE_CHAT_DEFAULT: "false"
      SYNVO_CODEX_WORKSPACES_0_WRITE_ENABLED: "true"
      SYNVO_CODEX_WORKSPACES_0_REPOSITORY_LABEL: Synvo Workspaces/Finance
      SYNVO_CODEX_WORKSPACES_1_ID: products
      SYNVO_CODEX_WORKSPACES_1_DISPLAY_NAME: Products
      SYNVO_CODEX_WORKSPACES_1_RUNNER_ROOT: /workspaces/products
      SYNVO_CODEX_WORKSPACES_1_NATIVE_CHAT_DEFAULT: "true"
      SYNVO_CODEX_WORKSPACES_1_WRITE_ENABLED: "true"
      SYNVO_CODEX_WORKSPACES_1_REPOSITORY_LABEL: Synvo Workspaces/Products
      SYNVO_CODEX_WORKSPACES_2_ID: sales
      SYNVO_CODEX_WORKSPACES_2_DISPLAY_NAME: Sales
      SYNVO_CODEX_WORKSPACES_2_RUNNER_ROOT: /workspaces/sales
      SYNVO_CODEX_WORKSPACES_2_NATIVE_CHAT_DEFAULT: "false"
      SYNVO_CODEX_WORKSPACES_2_WRITE_ENABLED: "true"
      SYNVO_CODEX_WORKSPACES_2_REPOSITORY_LABEL: Synvo Workspaces/Sales
      SYNVO_CODEX_ALLOWED_MCP_SERVERS: ${SYNVO_CODEX_ALLOWED_MCP_SERVERS:-}

  codex-runner:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    pids_limit: 256
    environment:
      SYNVO_CODEX_RUNNER_ENABLED: "true"
      SYNVO_CODEX_HOME: /var/lib/synvo-codex
      CODEX_HOME: /var/lib/synvo-codex
      SYNVO_CODEX_MCP_ALLOWLIST: ${SYNVO_CODEX_ALLOWED_MCP_SERVERS:-}
      SYNVO_MCP_FIXTURE_ROOT: /var/lib/synvo-mcp-fixture
    volumes:
      - synvo_codex_credentials:/var/lib/synvo-codex
      - type: bind
        source: ${SYNVO_CODEX_FINANCE_WORKSPACE_HOST_PATH:-./workspaces/Finance}
        target: /workspaces/finance
      - type: bind
        source: ${SYNVO_CODEX_PRODUCTS_WORKSPACE_HOST_PATH:-./workspaces/Products}
        target: /workspaces/products
      - type: bind
        source: ${SYNVO_CODEX_SALES_WORKSPACE_HOST_PATH:-./workspaces/Sales}
        target: /workspaces/sales
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2))['state'] == 'ready'"]

volumes:
  synvo_codex_credentials:
