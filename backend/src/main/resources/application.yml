spring:
  application:
    name: synvo-assistant
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/synvo}
    username: ${SPRING_DATASOURCE_USERNAME:synvo}
    password: ${SPRING_DATASOURCE_PASSWORD:synvo_local}
    hikari:
      connection-timeout: 3000
  lifecycle:
    timeout-per-shutdown-phase: 10s
  flyway:
    enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: SYNVO_SESSION
        http-only: true
        same-site: strict
        secure: ${SYNVO_SESSION_SECURE_COOKIE:${SYNVO_LARK_ENABLED:false}}
      timeout: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.azure: OFF
    com.microsoft.aad.msal4j: OFF
    com.lark.oapi.service.authen.v1.resource: OFF
    com.lark.oapi.ws.Client: WARN
    com.lark.oapi.ws.Listener: WARN

synvo:
  billing:
    workflow:
      enabled: ${SYNVO_BILLING_WORKFLOW_ENABLED:false}
      workspace-id: ${SYNVO_BILLING_WORKFLOW_WORKSPACE_ID:billing}
      package-root: ${SYNVO_BILLING_WORKFLOW_PACKAGE_ROOT:/workspaces/billing}
    enabled: ${SYNVO_BILLING_ENABLED:false}
    tenant-id: ${SYNVO_AZURE_TENANT_ID:}
    client-id: ${SYNVO_AZURE_CLIENT_ID:}
    account-id: ${SYNVO_AZURE_BILLING_ACCOUNT_ID:}
    profile-id: ${SYNVO_AZURE_BILLING_PROFILE_ID:}
    private-key-path: ${SYNVO_AZURE_PRIVATE_KEY_PATH:}
    public-cert-path: ${SYNVO_AZURE_PUBLIC_CERT_PATH:}
  agent:
    response-timeout: ${SYNVO_AGENT_RESPONSE_TIMEOUT:30m}
  codex:
    enabled: ${SYNVO_CODEX_ENABLED:false}
    runner-base-url: ${SYNVO_CODEX_RUNNER_BASE_URL:http://codex-runner:8090}
    model: ${SYNVO_CODEX_MODEL:gpt-5.6-sol}
    runtime-version: ${SYNVO_CODEX_RUNTIME_VERSION:0.148.0}
    reasoning-effort: ${SYNVO_CODEX_REASONING_EFFORT:high}
    request-timeout: ${SYNVO_CODEX_REQUEST_TIMEOUT:30s}
    activity-poll-timeout: ${SYNVO_CODEX_ACTIVITY_POLL_TIMEOUT:25s}
    interaction-timeout: ${SYNVO_CODEX_INTERACTION_TIMEOUT:5m}
  lark:
    enabled: ${SYNVO_LARK_ENABLED:false}
    app-id: ${SYNVO_LARK_APP_ID:}
    app-secret: ${SYNVO_LARK_APP_SECRET:}
    transport: ${SYNVO_LARK_TRANSPORT:websocket}
    pilot-open-id: ${SYNVO_LARK_PILOT_OPEN_ID:}
    h5-base-url: ${SYNVO_LARK_H5_BASE_URL:}
    token-encryption-key: ${SYNVO_TOKEN_ENCRYPTION_KEY:}
    token-refresh-skew: ${SYNVO_LARK_TOKEN_REFRESH_SKEW:5m}
    message-retention: ${SYNVO_LARK_MESSAGE_RETENTION:30d}
  model:
    enabled: ${SYNVO_MODEL_ENABLED:false}
    base-url: ${SYNVO_MODEL_BASE_URL:}
    name: ${SYNVO_MODEL_NAME:}
    api-key: ${SYNVO_MODEL_API_KEY:}
